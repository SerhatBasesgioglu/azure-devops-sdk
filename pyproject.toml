[project]
name = "ado-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Serhat Başesgioğlu", email = "55340640+SerhatBasesgioglu@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.scripts]
ado-lab = "ado_lab:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
